<script>
var numeros = [];
var busca;
var encontrou = false;
var i = 0;
for (i = 0; i < 10; i++) {
  numeros[i] = parseInt(prompt("Digite um número:"));
}
busca = parseInt(prompt("Qual número deseja procurar?"));
for (i = 0; i < 10; i++) {
  if (numeros[i] == busca) {
    encontrou = true;
  }
}
if (encontrou == true) {
  document.write("Número encontrado");
} else {
  document.write("Número não encontrado");
}
</script>
