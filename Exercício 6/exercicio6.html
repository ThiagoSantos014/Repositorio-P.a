<script>
var numeros = [4, 8, 12, 16, 20, 24, 28, 32, 36, 40];
var busca = 20;
var encontrou = false;

for (var i = 0; i < 10; i++) {
  if (numeros[i] == busca) {
    encontrou = true;
  }
}

if (encontrou) {
  document.write("O número " + busca + " foi encontrado.");
} else {
  document.write("O número " + busca + " não foi encontrado.");
}
</script>
