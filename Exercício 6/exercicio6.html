<script>
var numeros = [4, 8, 12, 16, 20, 24, 28, 32, 36, 40];
var busca = 20;
var encontrou = false;
var i = 0;
for (i = 0; i < 10; i++) {
  if (numeros[i] == busca) {
    encontrou = true;
  }
}
if (encontrou == true) {
  document.write("Número encontrado");
} else {
  document.write("Número não encontrado");
}
</script>
