<script>
var numeros = [];
var busca;
var encontrou = false;

for (var i = 0; i < 10; i++) {
  numeros[i] = Number(prompt("Digite o " + (i + 1) + "º número:"));
}

busca = Number(prompt("Digite o número que deseja procurar:"));

for (var i = 0; i < 10; i++) {
  if (numeros[i] == busca) {
    encontrou = true;
  }
}

if (encontrou) {
  alert("O número foi encontrado.");
} else {
  alert("O número não foi encontrado.");
}
