<script>
var numeros = [];
var positivos = 0;
var negativos = 0;
var zeros = 0;

for (var i = 0; i < 10; i++) {
  numeros[i] = Number(prompt("Digite o " + (i + 1) + "º número:"));

  if (numeros[i] > 0) {
    positivos++;
  } else if (numeros[i] < 0) {
    negativos++;
  } else {
    zeros++;
  }
}

alert("Positivos: " + positivos + "\nNegativos: " + negativos + "\nZeros: " + zeros);
