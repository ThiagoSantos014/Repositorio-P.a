<script>
var numeros = [];
var positivos = 0;
var negativos = 0;
var zeros = 0;
var i = 0;

for (i = 0; i < 10; i++) {
  numeros[i] = parseInt(prompt("Digite um número:"));
}

for (i = 0; i < 10; i++) {
  if (numeros[i] > 0) {
    positivos++;
  } else if (numeros[i] < 0) {
    negativos++;
  } else {
    zeros++;
  }
}

document.write("Positivos: " + positivos + "<br>");
document.write("Negativos: " + negativos + "<br>");
document.write("Zeros: " + zeros);
</script>
