<script>
var numeros = [];
var resultado = "Números digitados:<br>";

function executar() {
  for (var i = 0; i < 10; i++) {
    numeros[i] = Number(document.getElementById("n" + i).value);
  }

  for (var i = 0; i < 10; i++) {
    resultado += numeros[i] + "<br>";
  }

  document.write(resultado);
}
</script>
