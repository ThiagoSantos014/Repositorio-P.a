<script>
var notas = [];
var soma = 0;
var aprovados = 0;
var reprovados = 0;
var resultado = "Notas: ";

for (var i = 0; i < 10; i++) {
  notas[i] = Number(prompt("Digite a " + (i + 1) + "ª nota:"));
  soma += notas[i];
  resultado += notas[i] + " ";

  if (notas[i] >= 6) {
    aprovados++;
  } else {
    reprovados++;
  }
}

resultado += "\nMédia: " + (soma / 10);
resultado += "\nAprovados: " + aprovados;
resultado += "\nReprovados: " + reprovados;

alert(resultado);
