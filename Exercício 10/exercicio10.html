<script>
var notas = [7, 5, 8, 6, 4, 9, 10, 3, 7, 6];
var soma = 0;
var aprovados = 0;
var reprovados = 0;
var i = 0;

while (i < 10) {
  soma = soma + notas[i];

  if (notas[i] >= 6) {
    aprovados++;
  } else {
    reprovados++;
  }

  i++;
}

document.write("Média: " + (soma / 10) + "<br>");
document.write("Aprovados: " + aprovados + "<br>");
document.write("Reprovados: " + reprovados);
</script>
