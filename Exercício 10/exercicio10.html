<script>
var notas = [];
var soma = 0;
var aprovados = 0;
var reprovados = 0;

document.write("Notas:<br>");

for (var i = 0; i < 10; i++) {
  notas[i] = Number(prompt("Digite a " + (i + 1) + "ª nota:"));
  soma = soma + notas[i];
  document.write(notas[i] + "<br>");

  if (notas[i] >= 6) {
    aprovados++;
  } else {
    reprovados++;
  }
}

document.write("Média: " + (soma / 10) + "<br>");
document.write("Aprovados: " + aprovados + "<br>");
document.write("Reprovados: " + reprovados);
</script>
