<script>
var notas = [7, 5, 8, 6, 4, 9, 10, 3, 7, 6];
var soma = 0;
var aprovados = 0;
var reprovados = 0;
var i = 0;
for (i = 0; i < 10; i++) {
  soma = soma + notas[i];
  if (notas[i] >= 6) {
    aprovados++;
  } else {
    reprovados++;
  }
}
document.write("Média: " + (soma / 10) + "<br>");
document.write("Aprovados: " + aprovados + "<br>");
document.write("Reprovados: " + reprovados + "<br>");
for (i = 0; i < 10; i++) {
  document.write(notas[i] + "<br>");
}
</script>
