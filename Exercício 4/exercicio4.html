<script>
var numeros = [];
var maior;
var menor;
var i = 0;

for (i = 0; i < 10; i++) {
  numeros[i] = parseInt(prompt("Digite um número:"));
}

maior = numeros[0];
menor = numeros[0];

for (i = 1; i < 10; i++) {
  if (numeros[i] > maior) {
    maior = numeros[i];
  }

  if (numeros[i] < menor) {
    menor = numeros[i];
  }
}

document.write("Maior: " + maior + "<br>");
document.write("Menor: " + menor);
</script>
