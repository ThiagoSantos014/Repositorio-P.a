<script>
var numeros = [];

for (var i = 0; i < 10; i++) {
  numeros[i] = Number(prompt("Digite o " + (i + 1) + "º número:"));
}

var maior = numeros[0];
var menor = numeros[0];

for (var i = 1; i < 10; i++) {
  if (numeros[i] > maior) {
    maior = numeros[i];
  }

  if (numeros[i] < menor) {
    menor = numeros[i];
  }
}

document.write("Maior número: " + maior + "<br>");
document.write("Menor número: " + menor);
</script>
