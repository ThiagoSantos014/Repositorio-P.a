<script>
var vetor1 = [];
var vetor2 = [];
var soma = [];
var resultado = "Soma dos vetores:\n";

for (var i = 0; i < 5; i++) {
  vetor1[i] = Number(prompt("Digite o " + (i + 1) + "º número do primeiro vetor:"));
}

for (var i = 0; i < 5; i++) {
  vetor2[i] = Number(prompt("Digite o " + (i + 1) + "º número do segundo vetor:"));
}

for (var i = 0; i < 5; i++) {
  soma[i] = vetor1[i] + vetor2[i];
  resultado += soma[i] + "\n";
}

alert(resultado);
