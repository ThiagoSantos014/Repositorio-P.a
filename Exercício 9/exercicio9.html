<script>
var vetor1 = [];
var vetor2 = [];
var vetor3 = [];
var i = 0;
for (i = 0; i < 5; i++) {
  vetor1[i] = parseInt(prompt("Digite um número para o primeiro vetor:"));
}
for (i = 0; i < 5; i++) {
  vetor2[i] = parseInt(prompt("Digite um número para o segundo vetor:"));
}
for (i = 0; i < 5; i++) {
  vetor3[i] = vetor1[i] + vetor2[i];
  document.write(vetor3[i] + "<br>");
}
</script>
