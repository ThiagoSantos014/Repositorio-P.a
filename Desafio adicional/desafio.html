<script>
var numeros = [];
var auxiliar;
var i = 0;
var j = 0;
for (i = 0; i < 10; i++) {
  numeros[i] = parseInt(prompt("Digite um número:"));
}
for (i = 0; i < 10; i++) {
  for (j = 0; j < 9; j++) {
    if (numeros[j] > numeros[j + 1]) {
      auxiliar = numeros[j];
      numeros[j] = numeros[j + 1];
      numeros[j + 1] = auxiliar;
    }
  }
}
for (i = 0; i < 10; i++) {
  document.write(numeros[i] + "<br>");
}
</script>
