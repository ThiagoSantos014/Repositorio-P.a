<script>
var numeros = [30, 10, 50, 20, 80, 40, 70, 60, 100, 90];
var auxiliar;

for (var i = 0; i < 9; i++) {
  for (var j = 0; j < 9 - i; j++) {
    if (numeros[j] > numeros[j + 1]) {
      auxiliar = numeros[j];
      numeros[j] = numeros[j + 1];
      numeros[j + 1] = auxiliar;
    }
  }
}

document.write("Números em ordem crescente:<br>");

for (var i = 0; i < 10; i++) {
  document.write(numeros[i] + "<br>");
}
</script>
