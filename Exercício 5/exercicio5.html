<script>
var numeros = [];
var pares = 0;
var impares = 0;
var i = 0;
for (i = 0; i < 10; i++) {
  numeros[i] = parseInt(prompt("Digite um número:"));
}
for (i = 0; i < 10; i++) {
  if (numeros[i] % 2 == 0) {
    pares++;
  } else {
    impares++;
  }
}
document.write("Pares: " + pares + "<br>");
document.write("Ímpares: " + impares);
</script>
