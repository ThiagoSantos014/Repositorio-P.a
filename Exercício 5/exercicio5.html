<script>
var numeros = [];
var pares = 0;
var impares = 0;

for (var i = 0; i < 10; i++) {
  numeros[i] = Number(prompt("Digite o " + (i + 1) + "º número:"));

  if (numeros[i] % 2 == 0) {
    pares++;
  } else {
    impares++;
  }
}

alert("Quantidade de pares: " + pares + "\nQuantidade de ímpares: " + impares);
