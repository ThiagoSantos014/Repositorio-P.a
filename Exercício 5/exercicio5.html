<script>
var numeros = [2, 5, 8, 11, 14, 17, 20, 23, 26, 29];
var pares = 0;
var impares = 0;
var i = 0;

while (i < 10) {
  if (numeros[i] % 2 == 0) {
    pares++;
  } else {
    impares++;
  }

  i++;
}

document.write("Quantidade de pares: " + pares + "<br>");
document.write("Quantidade de ímpares: " + impares);
</script>
